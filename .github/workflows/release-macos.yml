name: Release macOS

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release-macos:
    name: Build and publish macOS ${{ matrix.arch }} release
    runs-on: ${{ matrix.runner }}
    strategy:
      max-parallel: 1
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            release_script: release:mac:arm64
          - arch: x64
            runner: macos-15-intel
            release_script: release:mac:x64
    env:
      GH_TOKEN: ${{ github.token }}
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      CSC_NAME: Tomasz Cwik (8Z5M7Q8M5S)
      CSC_KEYCHAIN: ${{ runner.temp }}/markpdf-signing.keychain-db
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify package version tag
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}."
            exit 1
          fi

      - name: Verify macOS signing secrets
        run: |
          missing=0
          for name in MAC_CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret for ${name}."
              missing=1
            fi
          done
          exit "${missing}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import macOS signing certificate
        env:
          KEYCHAIN_PASSWORD: markpdf-ci-keychain
        run: |
          CERTIFICATE_PATH="${RUNNER_TEMP}/markpdf-certificate.p12"
          echo "${MAC_CSC_LINK}" | base64 -D > "${CERTIFICATE_PATH}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${CSC_KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${CSC_KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${CSC_KEYCHAIN}"
          security import "${CERTIFICATE_PATH}" -k "${CSC_KEYCHAIN}" -P "${CSC_KEY_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${CSC_KEYCHAIN}"
          security list-keychains -d user -s "${CSC_KEYCHAIN}" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "${CSC_KEYCHAIN}"

      - name: Build, sign, notarize, and publish
        run: npm run "${{ matrix.release_script }}"
